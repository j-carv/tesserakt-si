name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check agent mirrors
        run: sh scripts/sync-agents.sh --check
      - name: Check agent instructions
        run: |
          python -c 'from pathlib import Path; a=Path("AGENTS.md").read_text(); c=Path("CLAUDE.md").read_text(); assert c.splitlines()[0] == "@AGENTS.md"; assert a.split("## Commit messages", 1)[1].strip() == c.split("## Commit messages", 1)[1].strip()'
          python -c 'from pathlib import Path; assert all("{{" not in p.read_text() for p in Path(".claude/agents").glob("*.md"))'
