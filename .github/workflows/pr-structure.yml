name: PR structure

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Validate description
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const headings = ['Summary', 'Specification and acceptance', 'Validation', 'Research and data impact', 'Documentation and compatibility'];
            const sections = [...body.matchAll(/^##\s+(.+?)\s*$/gm)];
            const failures = [];
            for (const heading of headings) {
              const matches = sections.filter(section => section[1] === heading);
              if (matches.length !== 1) {
                failures.push(`${heading}: expected exactly one section`);
                continue;
              }
              const section = matches[0];
              const next = sections.find(other => other.index > section.index);
              const content = body.slice(section.index + section[0].length, next ? next.index : body.length).trim();
              if (content.length < 20 || /^(?:n\/?a|none|no|not applicable)[.!\s]*$/i.test(content)) {
                failures.push(`${heading}: provide a specific explanation (at least 20 characters)`);
              }
            }
            if (failures.length) core.setFailed(failures.join('\n'));
            else core.info('All required PR sections contain an explanation. Maintainer review remains required.');
